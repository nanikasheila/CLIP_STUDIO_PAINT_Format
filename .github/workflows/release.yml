name: Release

# Pushing a tag vX.Y.Z builds cspf for each platform and the Python package,
# and attaches them to a GitHub release of that tag. Publishing to crates.io
# and PyPI is done by hand (docs/releasing.md).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  cspf:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p cspf --target ${{ matrix.target }}
      - name: Archive
        shell: bash
        run: |
          name=cspf-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir "$name"
          cp README.md README.en.md LICENSE CHANGELOG.md "$name"/
          # The archive is read away from the repository: links point at this tag.
          python tools/release/readme_links.py --base "https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/" \
            --keep README.md --keep README.en.md --keep LICENSE --keep CHANGELOG.md "$name"/*.md
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp target/${{ matrix.target }}/release/cspf.exe "$name"/
            7z a "$name.zip" "$name" > /dev/null
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            cp target/${{ matrix.target }}/release/cspf "$name"/
            tar czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cspf-${{ matrix.target }}
          path: ${{ env.ASSET }}

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build && python -m build python --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: python
          path: dist/*

  release:
    needs: [cspf, python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: cd assets && sha256sum * > SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* --title "$GITHUB_REF_NAME" \
            --notes "Changes: https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md"
