[package]
name = "csp-lab"
description = "Investigation and validation tools for the CSP format work (not published)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
csp-format.workspace = true
csp-assets.workspace = true
flate2 = { version = "1.1", default-features = false, features = ["zlib"] }
rusqlite = { version = "0.40", features = ["bundled", "serialize"] }
serde_json = { version = "1", features = ["preserve_order"] }
