[package]
name = "cspf"
description = "Command line tool for CLIP STUDIO PAINT files: inspect, extract, render, verify, corpus checks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
csp-format.workspace = true
csp-assets.workspace = true
rusqlite = { version = "0.40", features = ["bundled", "serialize"] }
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3"
