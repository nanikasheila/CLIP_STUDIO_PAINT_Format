[workspace]
resolver = "3"
members = ["crates/csp-format", "crates/csp-assets", "crates/cspf", "crates/csp-lab"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/nanikasheila/CLIP_STUDIO_PAINT_Format"
rust-version = "1.88"
homepage = "https://github.com/nanikasheila/CLIP_STUDIO_PAINT_Format"
authors = ["nanikasheila"]

[workspace.dependencies]
csp-format = { path = "crates/csp-format", version = "0.1.0" }
csp-assets = { path = "crates/csp-assets", version = "0.1.0" }
