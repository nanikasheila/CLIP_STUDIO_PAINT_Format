[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "csp-format"
version = "0.1.0"
description = "Read CLIP STUDIO PAINT files (.clip, .cmc) with the Python standard library only"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[tool.setuptools]
packages = ["csp_format"]
